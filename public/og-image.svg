<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#090B10"/>
  <circle cx="600" cy="315" r="450" fill="url(#bgRadial)" opacity="0.4"/>
  
  <!-- Subtle Grid lines -->
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  
  <!-- Logo Mark -->
  <rect x="100" y="100" width="64" height="64" rx="16" fill="#121622" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="132" cy="132" r="22" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3 4"/>
  <path d="M124 132C124 127 127 124 132 124C137 124 140 127 140 132" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="132" cy="132" r="4" fill="#38BDF8"/>
  
  <!-- Brand Text -->
  <text x="180" y="142" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">SHRIS AI</text>
  
  <!-- Pill Badge -->
  <rect x="100" y="210" width="220" height="38" rx="19" fill="rgba(230,168,56,0.12)" stroke="rgba(230,168,56,0.3)" stroke-width="1"/>
  <text x="120" y="234" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="1">AI VOICE WORKFORCE</text>
  
  <!-- Main Headline -->
  <text x="100" y="320" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">AI agents that talk,</text>
  <text x="100" y="390" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">understand, and take action.</text>
  
  <!-- Subtitle -->
  <text x="100" y="460" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Horizontal AI voice workforce platform for high-volume enterprise calling.</text>
  
  <!-- Metrics Footer Strip -->
  <rect x="100" y="520" width="1000" height="60" rx="12" fill="#121622" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="140" y="556" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">&lt; 300ms Latency</text>
  <text x="360" y="556" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">10+ Regional Languages</text>
  <text x="680" y="556" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">99.4% Intent Accuracy</text>
  <text x="960" y="556" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">CRM Handoff</text>

  <defs>
    <radialGradient id="bgRadial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 315) rotate(90) scale(450)">
      <stop stop-color="#E6A838" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="100" y1="320" x2="800" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCD34D"/>
      <stop offset="0.5" stop-color="#E6A838"/>
      <stop offset="1" stop-color="#B47818"/>
    </linearGradient>
  </defs>
</svg>
